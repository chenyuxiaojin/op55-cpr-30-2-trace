<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OP55 预览</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/300.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter/wght.css">
<style>
  html, body { margin: 0; background: #05070a; color: #cfd6de; font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; max-width: calc((100vh - 60px) * 16 / 9); margin: 0 auto; aspect-ratio: 16 / 9; height: auto; }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 8px; }
  input[type=range] { width: 60vw; }
  body.render .bar { display: none; }
  body.render canvas { width: 1920px; max-width: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar"><button id="play">暂停</button><input id="seek" type="range" min="0" value="0"><span id="info"></span></div>
<script type="module">
import { parseSrt } from './src/srt.js';
import { init, drawFrame, allText, FPS, NUM_TEXT } from './src/scene.js';

const params = new URLSearchParams(location.search);
const renderMode = params.has('render');
if (renderMode) document.body.classList.add('render');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const srt = await (await fetch('subtitles.srt', { cache: 'no-store' })).text();
const { totalFrames } = init(parseSrt(srt));
const text = allText();
const faces = [[300, '"Noto Sans SC"', text], [500, '"Noto Sans SC"', text], [700, '"Noto Sans SC"', text], [900, '"Noto Sans SC"', text], [500, '"Inter Variable"', NUM_TEXT], [600, '"Inter Variable"', NUM_TEXT], [720, '"Inter Variable"', NUM_TEXT], [780, '"Inter Variable"', NUM_TEXT]];
for (const [w, f, s] of faces) await document.fonts.load(`${w} 64px ${f}`, s);
await document.fonts.ready;
for (const [w, f, s] of faces) {
  if (!document.fonts.check(`${w} 64px ${f}`, s)) throw new Error(`字体未就绪: ${f} ${w}`);
}

window.__info = { totalFrames, fps: FPS };
window.__renderPNG = (frame, label) => {
  drawFrame(ctx, frame);
  if (label) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, 300, 64);
    ctx.fillStyle = '#ffd400';
    ctx.font = '700 40px "Inter Variable"';
    ctx.fillText(`f${frame} ${(frame / FPS).toFixed(2)}s`, 14, 46);
  }
  return canvas.toDataURL('image/png').slice('data:image/png;base64,'.length);
};
window.__ready = true;

if (!renderMode) {
  const seek = document.getElementById('seek');
  const info = document.getElementById('info');
  const btn = document.getElementById('play');
  seek.max = totalFrames - 1;
  let playing = true, frame = 0, t0 = performance.now();
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '暂停' : '播放'; t0 = performance.now() - (frame / FPS) * 1000; };
  seek.oninput = () => { frame = +seek.value; t0 = performance.now() - (frame / FPS) * 1000; drawFrame(ctx, frame); };
  const tick = (now) => {
    if (playing) { frame = Math.floor(((now - t0) / 1000) * FPS) % totalFrames; seek.value = frame; drawFrame(ctx, frame); }
    info.textContent = `${frame} / ${totalFrames}`;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
